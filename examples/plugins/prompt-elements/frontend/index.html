<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><script src="../../sdk.js" defer></script><script src="app.js" defer></script></head><body><main><h1>动态提示词元素</h1><p class="muted">规则只影响本次发给模型的上下文，不修改保存的对话。匹配可以读取上下文、最后一条用户消息、指定角色和系统片段。</p><section class="panel"><label>配置范围<select id="project" aria-label="配置范围"><option value="">全局默认</option></select></label><label><input id="enabled" type="checkbox" checked> 启用动态注入</label><div id="elements"></div><label>元素定义（JSON）<textarea id="element-json" aria-label="元素定义" rows="9"></textarea></label><label>规则定义（JSON）<textarea id="rule-json" aria-label="规则定义" rows="13"></textarea></label><div class="row"><button id="save">保存规则</button><button id="export" class="secondary">导出配置</button></div></section><section class="panel"><h2>上下文预览</h2><label>系统提示词<textarea id="system" rows="3">你是一位小说创作助手。</textarea></label><label>用户消息<textarea id="user" rows="3">描写一段梦境中的战斗。</textarea></label><button id="preview">预览注入结果</button><p id="status" role="status"></p><div id="matched"></div><pre id="output"></pre></section></main></body></html>
