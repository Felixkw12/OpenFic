<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><script src="../../sdk.js" defer></script><script src="app.js" defer></script></head><body><main><h1>Google Drive 章节同步</h1><p class="muted">同步已保存的章节。两端同时修改时保留双方内容，待你选择解决冲突。不会传播删除。</p><section class="panel"><div class="row"><button id="connect">连接 Google Drive</button><button id="disconnect" class="secondary">断开连接</button><span id="connection">检查连接…</span></div><p id="redirect" class="muted"></p><details><summary>使用已有 OAuth access token</summary><label>Access token<input id="token" type="password" autocomplete="off"></label><button id="save-token" class="secondary">安全保存令牌</button></details></section><section class="panel"><label>选择项目<select id="project" aria-label="选择项目"></select></label><div class="row"><select id="mode" aria-label="同步方向"><option value="two-way">双向同步</option><option value="push">仅上传本地变化</option><option value="pull">仅拉取云端变化</option></select><button id="sync">立即同步</button><button id="preview" class="secondary">预览变化</button></div><p id="status" role="status"></p><div id="report"></div><div id="conflicts"></div></section></main></body></html>
