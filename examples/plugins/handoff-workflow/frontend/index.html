<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><script src="../../sdk.js" defer></script><script src="app.js" defer></script></head><body><main><h1>Handoff 写作工作流</h1><p class="muted">规划 Agent → 写作 Agent → 审稿 Agent。模型通过 handoff 工具交接控制权；审稿可将反馈交回写作。</p><section class="panel"><label>选择项目<select id="project" aria-label="选择项目"></select></label><label>调用模型<select id="model" aria-label="调用模型"></select></label><label>写作任务<textarea id="prompt">写一段旅人在山谷遇见旧友的故事，保持人物动机一致。</textarea></label><div class="row"><button id="run">运行工作流</button><button id="demo" class="secondary">演示交接（不调用模型）</button></div><p id="status" role="status"></p></section><section class="panel"><h2>项目默认工作流</h2><p>只影响选中项目之后发起的 Agent 回合，可随时恢复内置工作流。</p><div class="row"><button id="select">为此项目启用 Handoff</button><button id="reset" class="secondary">恢复内置工作流</button></div></section><section class="panel"><h2>交接记录</h2><div id="trace"></div><h2>最终输出</h2><pre id="output"></pre><div class="row"><button id="save" class="secondary">保存为项目笔记</button><button id="download" class="secondary">导出结果</button></div></section></main></body></html>
